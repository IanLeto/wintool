<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wintool - Windows 文件管理工具</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .hide-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            z-index: 1000;
        }
        .hide-btn:hover {
            background: #e0e0e0;
        }
        .tool-card.hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <button class="hide-btn" onclick="togglePersonal()">隐藏/显示个人工具</button>
    <div class="page">
        <header class="header">
            <h1 class="logo">Wintool</h1>
            <p class="tagline">Windows 文件管理工具集</p>
        </header>
        <main class="home-content">
            <div class="tool-grid">
                {% for t in tools %}
                <a href="/tools/{{ t.id }}" class="tool-card" data-tool-id="{{ t.id }}">
                    <span class="tool-card-name">{{ t.name }}</span>
                    <span class="tool-card-arrow">→</span>
                </a>
                {% endfor %}
            </div>
        </main>
    </div>
    <script>
        // 个人工具ID列表
        const PERSONAL_TOOLS = ['milestones', 'shore_info', 'provincial_exam'];
        
        // 读取隐藏状态
        let isHidden = localStorage.getItem('hidePersonal') === 'true';
        
        function togglePersonal() {
            isHidden = !isHidden;
            localStorage.setItem('hidePersonal', isHidden);
            applyHidden();
        }
        
        function applyHidden() {
            PERSONAL_TOOLS.forEach(id => {
                const card = document.querySelector(`[data-tool-id="${id}"]`);
                if (card) {
                    if (isHidden) {
                        card.classList.add('hidden');
                    } else {
                        card.classList.remove('hidden');
                    }
                }
            });
        }
        
        // 页面加载时应用状态
        applyHidden();
    </script>
</body>
</html>
